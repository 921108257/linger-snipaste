[package]
name = "linger-snipaste"
version = "0.4.0"
edition = "2021"
description = "A Linux desktop screenshot and annotation tool"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-single-instance = "2"
[profile.release]
lto = true
codegen-units = 1
strip = true
